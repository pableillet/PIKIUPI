// COIN FLIP COMPONENT
// =========================================================
function CoinFlip({ onResult, t, caraProbability = 0.55 }) {
  const [flipping, setFlipping] = useState(false);
  const [result, setResult] = useState(null);
  const [rot, setRot] = useState(0);
  const flip = () => {
    if (flipping || result) return;
    setFlipping(true);
    setResult(null);
    const cara = Math.random() < caraProbability;
    // We need rotation to end on the right face.
    // CARA = front (rotation 0, 360, 720...)  -> end on multiple of 360
    // CRUZ = back  (rotation 180, 540...)     -> end on 180 + multiple of 360
    // Use enough spins for a satisfying flip.
    setRot(prev => {
      // Add a random extra full spins to make it feel different each time
      const extraSpins = 5 + Math.floor(Math.random() * 3); // 5-7 extra full spins
      const baseRotation = extraSpins * 360;
      return baseRotation + (cara ? 0 : 180);
    });
    setTimeout(() => {
      setFlipping(false);
      setResult(cara ? "cara" : "cruz");
      onResult(cara);
    }, 2000);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 22 }}>
      {/* Coin container with perspective */}
      <div style={{ perspective: 1000, width: 140, height: 140, cursor: flipping || result ? "default" : "pointer" }} onClick={flip}>
        <div style={{
          width: "100%",
          height: "100%",
          position: "relative",
          transformStyle: "preserve-3d",
          transition: flipping ? "transform 2s cubic-bezier(0.34, 0.05, 0.18, 1)" : (result ? "transform .3s" : "none"),
          transform: `rotateY(${rot}deg)`,
        }}>
          {/* CARA — front face (rotation 0) */}
          <div style={{
            position: "absolute",
            width: "100%",
            height: "100%",
            borderRadius: "50%",
            WebkitBackfaceVisibility: "hidden",
            backfaceVisibility: "hidden",
            background: "radial-gradient(circle at 30% 28%, #FFF4B8 0%, #FFD700 35%, #E6A800 80%, #B88800 100%)",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            fontSize: 36,
            fontWeight: 900,
            color: "#6B1FE8",
            border: "4px solid #6B1FE8",
            letterSpacing: 1,
            boxShadow: "inset 0 -10px 25px rgba(184,136,0,0.5), inset 0 10px 25px rgba(255,255,255,0.4), 0 8px 20px rgba(0,0,0,0.3)",
          }}>
            <span style={{ textShadow: "0 2px 4px rgba(74,15,160,0.3)" }}>CARA</span>
          </div>
          {/* CRUZ — back face (rotation 180) */}
          <div style={{
            position: "absolute",
            width: "100%",
            height: "100%",
            borderRadius: "50%",
            WebkitBackfaceVisibility: "hidden",
            backfaceVisibility: "hidden",
            transform: "rotateY(180deg)",
            background: "radial-gradient(circle at 30% 28%, #A969FF 0%, #6B1FE8 40%, #4A0FA0 85%, #2A0670 100%)",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            fontSize: 36,
            fontWeight: 900,
            color: "#FFD700",
            border: "4px solid #FFD700",
            letterSpacing: 1,
            boxShadow: "inset 0 -10px 25px rgba(42,6,112,0.6), inset 0 10px 25px rgba(255,255,255,0.2), 0 8px 20px rgba(0,0,0,0.3)",
          }}>
            <span style={{ textShadow: "0 2px 4px rgba(0,0,0,0.4)" }}>CRUZ</span>
          </div>
        </div>
      </div>

      {!flipping && !result && <p style={{ color: t.accent, fontSize: 16, fontWeight: 700, animation: "pulse 1.5s infinite" }}>Toca para lanzar</p>}
      {result && (
        <div style={{
          padding: "16px 30px",
          borderRadius: 16,
          background: result === "cara" ? "linear-gradient(135deg,#FFD700,#FFA500)" : "linear-gradient(135deg,#6B1FE8,#4A0FA0)",
          color: result === "cara" ? "#1a1a2e" : "#FFD700",
          fontSize: 22,
          fontWeight: 900,
          textTransform: "uppercase",
          animation: "bounceIn .5s",
          boxShadow: result === "cara" ? "0 6px 30px rgba(255,215,0,0.6)" : "0 6px 30px rgba(107,31,232,0.6)",
          letterSpacing: 1,
        }}>
          {result === "cara" ? "¡Ea, a contarlo!" : "Secretito 💋"}
        </div>
      )}
    </div>
  );
}

function BottleSpin({ players, currentPlayerIdx, compatibleIdxs, onResult, t }) {
  const [spinning, setSpinning] = useState(false);
  const [rotation, setRotation] = useState(0);
  const [target, setTarget] = useState(null);

  const radius = 110;
  const numPlayers = players.length;
  const anglePerPlayer = 360 / numPlayers;

  const spin = () => {
    if (spinning || target !== null) return;
    setSpinning(true);
    // Prefer compatible players. Fall back to anyone other than current.
    let candidates;
    if (compatibleIdxs && compatibleIdxs.length > 0) {
      candidates = compatibleIdxs.filter(i => i !== currentPlayerIdx);
      if (candidates.length === 0) candidates = players.map((_, i) => i).filter(i => i !== currentPlayerIdx);
    } else {
      candidates = players.map((_, i) => i).filter(i => i !== currentPlayerIdx);
    }
    const tgtIdx = candidates[Math.floor(Math.random() * candidates.length)];
    const fullSpins = 5 * 360;
    const finalAngle = fullSpins + (tgtIdx * anglePerPlayer);
    setRotation(finalAngle);
    setTimeout(() => {
      setTarget(tgtIdx);
      setSpinning(false);
      onResult(tgtIdx);
    }, 3500);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 20, width: "100%" }}>
      {/* Circle with players */}
      <div style={{ position: "relative", width: 280, height: 280 }}>
        {/* Player names around the circle */}
        {players.map((p, i) => {
          const angle = (i * anglePerPlayer - 90) * Math.PI / 180;
          const x = 140 + radius * Math.cos(angle);
          const y = 140 + radius * Math.sin(angle);
          const isCurrent = i === currentPlayerIdx;
          const isTarget = target === i;
          return (
            <div key={i} style={{
              position: "absolute",
              left: x,
              top: y,
              transform: "translate(-50%, -50%)",
              padding: "6px 10px",
              borderRadius: 12,
              background: isTarget ? "linear-gradient(135deg,#FFD700,#FFA500)" : (isCurrent ? "linear-gradient(135deg,#6B1FE8,#5A18C9)" : t.cardBg),
              color: isTarget ? "#1a1a2e" : (isCurrent ? "#FFD700" : t.text),
              fontSize: 12,
              fontWeight: 800,
              border: `2px solid ${isTarget ? "#FFD700" : (isCurrent ? "#6B1FE8" : t.cardBorder)}`,
              whiteSpace: "nowrap",
              maxWidth: 100,
              overflow: "hidden",
              textOverflow: "ellipsis",
              boxShadow: isTarget ? "0 0 20px rgba(255,215,0,0.6)" : "none",
              transition: "all .3s",
            }}>{p.name}</div>
          );
        })}
        {/* Center bottle */}
        <div style={{
          position: "absolute",
          left: "50%",
          top: "50%",
          width: 140,
          height: 140,
          transform: `translate(-50%, -50%) rotate(${rotation}deg)`,
          transition: spinning ? "transform 3.5s cubic-bezier(0.17, 0.67, 0.21, 0.99)" : "none",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          filter: "drop-shadow(0 4px 12px rgba(0,0,0,0.35))",
        }}>
          {/* Realistic bottle SVG */}
          <svg width="140" height="140" viewBox="0 0 100 140">
            <defs>
              <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#3A0A80" />
                <stop offset="35%" stopColor="#7B30F0" />

              </linearGradient>
              <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#B89000" />

              </linearGradient>
              <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">

              d="M 44 8
                 L 44 28

                 C 34 44, 30 50, 30 60
                 L 30 118
                 C 30 125, 33 128, 40 128
                 L 60 128
                 C 67 128, 70 125, 70 118
                 L 70 60
                 C 70 50, 66 44, 62 38
                 C 60 34, 56 32, 56 28
                 L 56 8
                 Z"
              fill="url(#bottleGrad)"
            />

            {/* Liquid inside (subtle) */}

// ROULETTE ANIMATION
// =========================================================
function RouletteAnim({ players, targetIdx, onDone, t }) {
  const [idx, setIdx] = useState(0);
  const [done, setDone] = useState(false);
  useEffect(() => {
    const start = Date.now();
    let current = 0;
    let timeoutId;
    const tick = () => {
      const elapsed = Date.now() - start;
      if (elapsed > 2500) {
        setIdx(targetIdx);
        setDone(true);
        setTimeout(onDone, 900);
        return;
      }
      const speed = 60 + Math.pow(elapsed / 2500, 2) * 300;
      current = (current + 1) % players.length;
      setIdx(current);
      timeoutId = setTimeout(tick, speed);
    };
    timeoutId = setTimeout(tick, 60);
    return () => clearTimeout(timeoutId);
  }, []);
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "60vh", gap: 24, padding: "0 24px" }}>
      <p style={{ fontSize: 14, color: t.textMuted, textTransform: "uppercase", letterSpacing: 2, fontWeight: 700 }}>Turno de...</p>
      <h1 style={{
        fontSize: done ? 60 : 50,
        fontWeight: 900,
        color: t.rouletteColor,
        textShadow: done ? (t.rouletteColor === "#FFD700" ? "0 0 40px rgba(255,215,0,0.6)" : "0 2px 20px rgba(74,15,160,0.4)") : "none",
        transition: "all .3s",
        textAlign: "center",
        wordBreak: "break-word",
        letterSpacing: "-1px",
      }}>{players[idx].name}</h1>
      {!done && <div style={{ width: 40, height: 4, borderRadius: 2, background: t.accent, animation: "pulse .3s infinite" }} />}
    </div>
  );
}

    btn: { padding: "16px 24px", borderRadius: 16, border: "none", fontSize: 17, fontWeight: 800, cursor: "pointer", transition: "transform .15s, box-shadow .15s", fontFamily: "'Nunito',sans-serif", WebkitTapHighlightColor: "transparent" },
    bP: { background: "linear-gradient(135deg,#6B1FE8,#5A18C9)", color: "#FFD700", boxShadow: "0 4px 20px rgba(107,31,232,.4)" },
    bS: { background: "linear-gradient(135deg,#FFD700,#FFC300)", color: "#1a1a2e", boxShadow: "0 4px 20px rgba(255,215,0,.4)" },
    bOutline: { background: "transparent", border: `2px solid ${t.accent}`, color: t.accent },
    card: { background: t.cardBg, borderRadius: 20, padding: 20, border: `1px solid ${t.cardBorder}` },
    inp: { width: "100%", padding: "14px 18px", borderRadius: 14, border: `2px solid ${t.inputBorder}`, background: t.inputBg, color: t.text, fontSize: 16, fontFamily: "'Nunito',sans-serif", outline: "none", boxSizing: "border-box", WebkitAppearance: "none" },
    chip: (a) => ({ padding: "10px 20px", borderRadius: 25, border: a ? `2px solid ${t.accent}` : `2px solid ${t.cardBorder}`, background: a ? t.accentSoft : "transparent", color: a ? t.accent : t.textMuted, cursor: "pointer", fontSize: 14, fontWeight: 700, transition: "all .2s", fontFamily: "'Nunito',sans-serif" }),
    tag: { display: "flex", alignItems: "center", gap: 8, padding: "8px 16px", borderRadius: 25, background: "linear-gradient(135deg,#6B1FE8,#5A18C9)", color: "#FFD700", fontSize: 14, fontWeight: 700 },
    tagX: { background: "none", border: "none", color: "#FFD700", cursor: "pointer", fontSize: 18, padding: "0 0 0 4px", lineHeight: 1 },
    sec: { padding: "0 20px", marginBottom: 24 },
    lab: { fontSize: 13, fontWeight: 800, color: t.accent, textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 },
    gc: { minHeight: "60vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "40px 24px", textAlign: "center" },
    bk: { background: "none", border: "none", color: t.textMuted, cursor: "pointer", padding: 8, display: "flex", alignItems: "center", gap: 4 },
    ib: { background: "none", border: "none", cursor: "pointer", color: t.textMuted, padding: 8, display: "flex", alignItems: "center", borderRadius: 10 },
    themeBtn: { width: 44, height: 44, borderRadius: 22, background: t.accentSoft, border: `1px solid ${t.cardBorder}`, color: t.accent, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" },
  };

  // =========================================================
  // GAME LOGIC
  // =========================================================
  const genEvents = useCallback(() => {
    const events = [];
    const order = shuffle(players.map((_, i) => i));

    if (gameMode === "pikiupi") {
      // Split minigames by whether they need an assigned player or not
      const assignedMgs = minigames.filter(m => m.hasAssignedPlayer);
      const groupMgs = minigames.filter(m => !m.hasAssignedPlayer);

      // Build the pool of possible individual-turn event types
      const individualOptions = [];
      if (modes.includes("truthOrDare")) individualOptions.push("truthOrDare");
      if (modes.includes("uncomfortableQuestions")) individualOptions.push("uncomf");
      if (modes.includes("minigames") && assignedMgs.length > 0) individualOptions.push("mgAssigned");

      // Generate one individual event per player (in shuffled order)
      const individualEvents = order.map(pIdx => {
        if (individualOptions.length === 0) return null;
        const choice = pick(individualOptions);
        const c = pick(cats);
        if (choice === "truthOrDare") {
          return { type: "truthOrDare", playerIdx: pIdx, category: c };
        } else if (choice === "uncomf") {
          const pool = uncomfContent[c] || [];
          if (pool.length > 0) return { type: "uncomf", playerIdx: pIdx, question: pick(pool) };
          return { type: "truthOrDare", playerIdx: pIdx, category: c };
        } else if (choice === "mgAssigned") {
          const mg = pick(assignedMgs);
          return { type: "mg", mg, apIdx: pIdx };
        }
        return null;
      }).filter(Boolean);

      // Build the pool of possible group events
      const groupPool = [];
      if (modes.includes("neverHaveI")) groupPool.push("never");
      if (modes.includes("minigames") && groupMgs.length > 0) groupPool.push("mgGroup");

      // Decide how many group events: average 2 per round, randomized between 1 and 3
      let numGroup = 0;
      if (groupPool.length > 0) {
        const r = Math.random();
        if (r < 0.2) numGroup = 1;
        else if (r < 0.8) numGroup = 2;
        else numGroup = 3;
      }

      // Generate the group events
      const groupEvents = [];
      for (let i = 0; i < numGroup; i++) {
        const choice = pick(groupPool);
        if (choice === "never") {
          const c = pick(cats);
          const pool = neverContent[c] || [];
          if (pool.length > 0) groupEvents.push({ type: "never", text: pick(pool) });
        } else if (choice === "mgGroup") {
          const mg = pick(groupMgs);
          groupEvents.push({ type: "mg", mg, apIdx: null });
        }
      }

      // Interleave: start with individual events, then insert group events at random positions
      const result = [...individualEvents];
      groupEvents.forEach(ge => {
        // Insert at a random position (not at position 0 ideally, but anywhere valid)
        const pos = Math.floor(Math.random() * (result.length + 1));
        result.splice(pos, 0, ge);
      });

      events.push(...result);
    } else if (gameMode === "truthOrDare") {
      order.forEach((pIdx) => {
        const c = pick(cats);
        events.push({ type: "truthOrDare", playerIdx: pIdx, category: c });
      });
    } else if (gameMode === "neverHaveI") {
      for (let i = 0; i < players.length * 2; i++) {
        const c = pick(cats);
        const pool = neverContent[c] || [];
        if (pool.length > 0) events.push({ type: "never", text: pick(pool) });
      }
    } else if (gameMode === "uncomfortableQuestions") {
      order.forEach((pIdx) => {
        const c = pick(cats);
        const pool = uncomfContent[c] || [];
        if (pool.length > 0) events.push({ type: "uncomf", playerIdx: pIdx, question: pick(pool) });
      });
    } else if (gameMode === "minigames") {
      for (let i = 0; i < players.length; i++) {
        const mg = pick(minigames);
        events.push({ type: "mg", mg, apIdx: mg.hasAssignedPlayer ? pick(players.map((_,j)=>j)) : null });
      }
    }
    return events;
  }, [players, cats, modes, neverContent, todContent, uncomfContent, minigames, gameMode]);

  const computePhase = (e) => {
    if (!e) return "content";
    // truthOrDare and uncomf show roulette
    if (e.type === "truthOrDare" || e.type === "uncomf") return "roulette";
    // never always shows splash
    if (e.type === "never") return "splash";
    // minigames: if has assigned player, do roulette; otherwise splash
    if (e.type === "mg") {
      if (e.mg.hasAssignedPlayer && e.apIdx !== null) return "roulette";
      return "splash";
    }
    return "content";
  };

  const startGame = () => {
    if (players.length < 2) return;
    const ev = genEvents();
    if (ev.length === 0) return;
    setEvents(ev);
    setEIdx(0);
    setRound(1);
    setTodChoice(null);
    setCoinResult(null);
    setMedDone(false);
    setBottleTarget(null);
    setBottleAction(null);
    setPhase(computePhase(ev[0]));
    setScreen("game");
  };

  const next = () => {
    setTodChoice(null);
    setCoinResult(null);
    setMedDone(false);
    setBottleTarget(null);
    setBottleAction(null);
    let ni, nr = round, ne = events;
    if (eIdx < events.length - 1) ni = eIdx + 1;
    else { ne = genEvents(); setEvents(ne); ni = 0; nr = round + 1; setRound(nr); }
    setEIdx(ni);
    setPhase(computePhase(ne[ni]));
  };

  const getTod = (c, type) => {
    const x = todContent[c] || todContent.casual;
    const pool = x[type] || [];
    return pool.length > 0 ? pick(pool) : "No hay contenido.";
  };

  // Get a compatible "Y" player for an action targeting X
  // Tries to find someone X is attracted to. Falls back to any other player.
  const getCompatibleY = (xIdx) => {
    const x = players[xIdx];
    if (!x) return null;
    const others = players.filter((_, i) => i !== xIdx);
    if (others.length === 0) return null;
    // Filter by X's attraction preferences
    const compatible = others.filter(p => x.attracted && x.attracted.includes(p.gender));
    if (compatible.length > 0) return compatible[Math.floor(Math.random() * compatible.length)];
    // Fallback: any other player (so the game doesn't break)
    return others[Math.floor(Math.random() * others.length)];
  };

  const repl = (txt, pi) => {
    let r = txt;
    if (r.includes("{X}")) r = r.replace(/\{X\}/g, players[pi].name);
    if (r.includes("{Y}")) {
      const o = getCompatibleY(pi);
      r = r.replace(/\{Y\}/g, o ? o.name : "alguien");
    }
    return r;
  };

  const startMedusa = () => {
    setMedCD(true);
    setMedN(3);
    const iv = setInterval(() => {
      setMedN(p => {
        if (p <= 1) { clearInterval(iv); setMedCD(false); setMedDone(true); return 0; }
        return p - 1;
      });
    }, 1000);
  };

  // =========================================================
  // EDITOR HELPERS
  // =========================================================
  const getPool = () => {
    if (eMode === "neverHaveI") return neverContent[eCat] || [];
    if (eMode === "uncomfortableQuestions") return uncomfContent[eCat] || [];
    if (eMode === "truthOrDare") return (todContent[eCat] || {})[eSub] || [];
    return [];
  };
  const setPool = (np) => {
    if (eMode === "neverHaveI") setNeverContent({ ...neverContent, [eCat]: np });
    else if (eMode === "uncomfortableQuestions") setUncomfContent({ ...uncomfContent, [eCat]: np });
    else if (eMode === "truthOrDare") setTodContent({ ...todContent, [eCat]: { ...todContent[eCat], [eSub]: np } });
  };
  const addItem = () => { if (!newTxt.trim()) return; setPool([...getPool(), newTxt.trim()]); setNewTxt(""); };
  const rmItem = (i) => setPool(getPool().filter((_,j)=>j!==i));
  const saveEdit = (i) => { const p = [...getPool()]; p[i] = editTxt; setPool(p); setEditIdx(null); setEditTxt(""); };

  // Minigame editor
  const openMgEditor = (mgId) => {
    if (mgId === null) {
      // create new
      setMgEditId(null);
      setMgName("");
      setMgDesc("");
      setMgHasP(true);
      setMgChance(null);
      setMgActions([]);
      setMgNewAction("");
      setMgCaraProb(50);
    } else {
      const mg = minigames.find(m => m.id === mgId);
      if (!mg) return;
      setMgEditId(mgId);
      setMgName(mg.name);
      setMgDesc(mg.description);
      setMgHasP(mg.hasAssignedPlayer);
      setMgChance(mg.chanceElement);
      setMgActions(mg.actions ? [...mg.actions] : []);
      setMgNewAction("");
      setMgCaraProb(typeof mg.caraProbability === "number" ? Math.round(mg.caraProbability * 100) : 50);
    }
    setScreen("mgEditForm");
  };

  const saveMinigame = () => {
    if (!mgName.trim()) return;
    if (mgEditId === null) {
      // creating new
      const newMg = {
        id: "mg_" + Date.now(),
        name: mgName,
        description: mgDesc,
        hasAssignedPlayer: mgHasP,
        chanceElement: mgChance,
        type: "custom",
      };
      if (mgChance === "bottle") newMg.actions = mgActions;
      if (mgChance === "coin") newMg.caraProbability = mgCaraProb / 100;
      setMinigames([...minigames, newMg]);
    } else {
      // editing existing — preserve type field
      const updated = minigames.map(m => {
        if (m.id !== mgEditId) return m;
        const next = {
          ...m,
          name: mgName,
          description: mgDesc,
          hasAssignedPlayer: mgHasP,
          chanceElement: mgChance,
        };
        if (mgChance === "bottle" || m.type === "builtin_botella") next.actions = mgActions;
        else delete next.actions;
        if (mgChance === "coin" || m.type === "builtin_moneda") next.caraProbability = mgCaraProb / 100;
        else delete next.caraProbability;
        return next;
      });
      setMinigames(updated);
    }
    setScreen("mgEdit");
  };

  const rmMinigame = (id) => setMinigames(minigames.filter(m => m.id !== id));

  // =========================================================
  // SCREENS
  // =========================================================
  const renderHome = () => {
    const modeButtons = [
      { mode: "pikiupi", label: "PIKIUPI", primary: true },
      { mode: "truthOrDare", label: "Verdad o Reto" },
      { mode: "neverHaveI", label: "Yo Nunca" },
      { mode: "uncomfortableQuestions", label: "Preguntas Incómodas" },
      { mode: "minigames", label: "Minijuegos" },
    ];
    return (
      <div style={S.app}>
        {/* Theme toggle (absolute) */}
        <div style={{ position: "absolute", top: "calc(env(safe-area-inset-top) + 56px)", right: 16, zIndex: 20 }}>
          <button style={S.themeBtn} onClick={() => setTheme(theme === "light" ? "dark" : "light")}>
            {theme === "light" ? Icons.moon : Icons.sun}
          </button>
        </div>

        {/* Logo fixed at top */}
        <div style={{ flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "60px 20px 10px" }}>
          <Logo color={t.logoColor} size={280} />
        </div>

        {/* Scrollable modes in the middle */}
        <div style={{
          flex: 1,
          overflowY: "auto",
          padding: "20px 20px 10px",
          display: "flex",
          flexDirection: "column",
          gap: 14,
          WebkitOverflowScrolling: "touch",
        }}>
          {modeButtons.map((m) => (
            <button
              key={m.mode}
              style={{
                ...(m.primary ? S.bP : { background: t.cardBg, color: t.text, border: `2px solid ${t.cardBorder}`, boxShadow: "0 2px 10px rgba(0,0,0,0.05)" }),
                width: "100%",
                borderRadius: 18,
                border: m.primary ? "none" : `2px solid ${t.cardBorder}`,
                padding: m.primary ? "22px 24px" : "18px 24px",
                cursor: "pointer",
                fontFamily: "'Nunito',sans-serif",
                fontSize: m.primary ? 24 : 19,
                fontWeight: 900,
                letterSpacing: m.primary ? 1.5 : 0.5,
                textTransform: "uppercase",
                textAlign: "center",
                transition: "transform .15s",
                textShadow: m.primary
                  ? "1px 1px 0 rgba(0,0,0,0.15)"
                  : "1px 1px 0 rgba(0,0,0,0.05)",
              }}
              onClick={() => { setGameMode(m.mode); setScreen("setup"); }}
            >
              {m.label}
            </button>
          ))}
          <div style={{ height: 10 }} />
        </div>

        {/* Personalizar + footer fixed at bottom */}
        <div style={{ flexShrink: 0, padding: "12px 20px 16px", background: theme === "light" ? "linear-gradient(180deg, transparent 0%, rgba(255,195,0,0.6) 30%, #FFC300 100%)" : "linear-gradient(180deg, transparent 0%, rgba(15,15,35,0.6) 30%, #0f0f23 100%)", backdropFilter: "blur(4px)" }}>
          <button style={{ ...S.btn, ...S.bOutline, width: "100%", padding: "14px 24px", fontSize: 15 }} onClick={() => setScreen("editor")}>
            Personalizar contenido
          </button>
          <div style={{ textAlign: "center", color: t.textMuted, fontSize: 11, marginTop: 10, opacity: 0.6 }}>
            © Todos los cubatas reservados
          </div>
        </div>
      </div>
    );
  };

  const renderSetup = () => {
    const modeName = {
      pikiupi: "PIKIUPI",
      truthOrDare: "Verdad o Reto",
      neverHaveI: "Yo Nunca",
      uncomfortableQuestions: "Preguntas Incómodas",
      minigames: "Minijuegos",
    }[gameMode];
    return (
      <div style={S.app}>
        <div style={{ ...S.hdr, flexShrink: 0 }}>
          <button style={S.bk} onClick={() => setScreen("home")}>{Icons.back}</button>
          <span style={{ fontWeight: 800, fontSize: 18, color: t.accent }}>{modeName}</span>
          <div style={{ width: 40 }} />
        </div>

        {/* Scrollable middle */}
        <div style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch", paddingBottom: 20 }}>
          <div style={S.sec}>
            <div style={S.lab}>Jugadores ({players.length}/16)</div>

            {/* Name input — always shown when not editing a player */}
            {editingPlayerIdx === null && (
              <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                <input
                  style={{ ...S.inp, flex: 1 }}
                  placeholder="Nombre del jugador..."
                  value={pInput}
                  onChange={e => setPInput(e.target.value)}
                  onKeyDown={e => {
                    if (e.key === "Enter" && pInput.trim() && players.length < 16) {
                      setPlayers([...players, { name: pInput.trim(), gender: "NB", attracted: ["M","F","NB"] }]);
                      setPInput("");
                    }
                  }}
                  maxLength={20}
                />
                <button style={{ ...S.btn, ...S.bP, padding: "12px 16px" }} onClick={() => {
                  if (pInput.trim() && players.length < 16) {
                    setPlayers([...players, { name: pInput.trim(), gender: "NB", attracted: ["M","F","NB"] }]);
                    setPInput("");
                  }
                }}>
                  {Icons.plus}
                </button>
              </div>
            )}

            {/* Edit gender/preferences modal */}
            {editingPlayerIdx !== null && players[editingPlayerIdx] && (
              <div style={{
                ...S.card,
                marginBottom: 12,
                border: `2px solid ${t.accent}`,
                animation: "fadeInUp .3s",
              }}>
                <div style={{ fontSize: 13, color: t.textMuted, marginBottom: 4 }}>Editando gustos de:</div>
                <div style={{ fontSize: 22, fontWeight: 900, color: t.accent, marginBottom: 16 }}>{players[editingPlayerIdx].name}</div>

                <div style={{ marginBottom: 16 }}>
                  <div style={S.lab}>¿Es?</div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    {[{k:"M",l:"Hombre"},{k:"F",l:"Mujer"},{k:"NB",l:"No binarie"}].map(g => (
                      <button key={g.k} style={S.chip(editGender === g.k)} onClick={() => setEditGender(g.k)}>{g.l}</button>
                    ))}
                  </div>
                </div>

                <div style={{ marginBottom: 16 }}>
                  <div style={S.lab}>Le interesa</div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    {[{k:"M",l:"Hombres"},{k:"F",l:"Mujeres"},{k:"NB",l:"No binaries"}].map(g => (
                      <button key={g.k} style={S.chip(editAttracted.includes(g.k))} onClick={() => {
                        if (editAttracted.includes(g.k)) setEditAttracted(editAttracted.filter(x => x !== g.k));
                        else setEditAttracted([...editAttracted, g.k]);
                      }}>{g.l}</button>
                    ))}
                  </div>
                  <p style={{ fontSize: 11, color: t.textMuted, marginTop: 6, opacity: 0.8 }}>Puedes seleccionar varios</p>
                </div>

                <div style={{ display: "flex", gap: 8 }}>
                  <button
                    style={{ ...S.btn, ...S.bOutline, flex: 1, padding: "12px 16px", fontSize: 14 }}
                    onClick={() => { setEditingPlayerIdx(null); }}
                  >
                    Cancelar
                  </button>
                  <button
                    style={{
                      ...S.btn, ...S.bP,
                      flex: 1, padding: "12px 16px", fontSize: 14,
                      opacity: (editGender && editAttracted.length > 0) ? 1 : 0.4,
                    }}
                    disabled={!editGender || editAttracted.length === 0}
                    onClick={() => {
                      const updated = [...players];
                      updated[editingPlayerIdx] = { ...updated[editingPlayerIdx], gender: editGender, attracted: editAttracted };
                      setPlayers(updated);
                      setEditingPlayerIdx(null);
                    }}
                  >
                    Guardar
                  </button>
                </div>
              </div>
            )}

            {/* Player tags with edit button */}
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {players.map((p, i) => {
                // Check if player has been personalized (not default)
                const isDefault = p.gender === "NB" && p.attracted && p.attracted.length === 3;
                return (
                  <div key={i} style={{ ...S.tag, paddingRight: 4 }}>
                    {p.name}
                    <button
                      style={{
                        background: "none",
                        border: "none",
                        color: "#FFD700",
                        cursor: "pointer",
                        padding: "0 4px",
                        marginLeft: 6,
                        opacity: isDefault ? 0.55 : 1,
                        display: "flex",
                        alignItems: "center",
                      }}
                      onClick={() => {
                        setEditingPlayerIdx(i);
                        setEditGender(p.gender);
                        setEditAttracted([...(p.attracted || [])]);
                      }}
                      title="Editar gustos"
                    >
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                      </svg>
                    </button>
                    <button style={S.tagX} onClick={() => setPlayers(players.filter((_,j)=>j!==i))}>×</button>
                  </div>
                );
              })}
            </div>
          </div>

          {gameMode !== "minigames" && (
            <div style={S.sec}>
              <div style={S.lab}>Categorías</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {[{k:"casual",l:"Casual"},{k:"picante",l:"Picante"},{k:"extremo",l:"Extremo"}].map(c => (
                  <button key={c.k} style={S.chip(cats.includes(c.k))} onClick={() => {
                    if (cats.includes(c.k)) { if (cats.length > 1) setCats(cats.filter(x => x !== c.k)); }
                    else setCats([...cats, c.k]);
                  }}>{c.l}</button>
                ))}
              </div>
            </div>
          )}

          {gameMode === "pikiupi" && (
            <div style={S.sec}>
              <div style={S.lab}>Modos a mezclar</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {[{k:"truthOrDare",l:"Verdad o Reto"},{k:"neverHaveI",l:"Yo Nunca"},{k:"uncomfortableQuestions",l:"Preguntas Incómodas"},{k:"minigames",l:"Minijuegos"}].map(m => (
                  <button key={m.k} style={{ ...S.chip(modes.includes(m.k)), display: "flex", alignItems: "center", gap: 8, textAlign: "left" }} onClick={() => {
                    if (modes.includes(m.k)) { if (modes.length > 1) setModes(modes.filter(x => x !== m.k)); }
                    else setModes([...modes, m.k]);
                  }}>
                    {modes.includes(m.k) ? Icons.check : <span style={{ width: 20 }} />} {m.l}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* Sticky bottom button */}
        <div style={{ flexShrink: 0, padding: "12px 20px 16px", background: theme === "light" ? "linear-gradient(180deg, transparent 0%, rgba(255,195,0,0.6) 30%, #FFC300 100%)" : "linear-gradient(180deg, transparent 0%, rgba(15,15,35,0.6) 30%, #0f0f23 100%)", backdropFilter: "blur(4px)" }}>
          <button style={{ ...S.btn, ...S.bP, width: "100%", opacity: players.length >= 2 ? 1 : .4, fontSize: 19, padding: 18 }} onClick={startGame} disabled={players.length < 2}>
            EMPEZAR
          </button>

                  {mg.hasAssignedPlayer && <span style={{ fontSize: 11, padding: "2px 10px", borderRadius: 10, background: "rgba(255,215,0,.25)", color: theme === "light" ? "#8B6F00" : t.yellow }}>Jugador asignado</span>}
                  {mg.chanceElement === "coin" && <span style={{ fontSize: 11, padding: "2px 10px", borderRadius: 10, background: t.accentSoft, color: t.accent }}>Moneda</span>}
                  {mg.chanceElement === "bottle" && <span style={{ fontSize: 11, padding: "2px 10px", borderRadius: 10, background: t.accentSoft, color: t.accent }}>Botella</span>}
                  {mg.chanceElement === "dice" && <span style={{ fontSize: 11, padding: "2px 10px", borderRadius: 10, background: t.accentSoft, color: t.accent }}>Dado</span>}
                </div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                <button style={S.ib} onClick={() => openMgEditor(mg.id)}>{Icons.edit}</button>
                <button style={{ ...S.ib, color: "#f44336" }} onClick={() => rmMinigame(mg.id)}>{Icons.trash}</button>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div style={S.sec}>
        <button style={{ ...S.btn, ...S.bP, width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }} onClick={() => openMgEditor(null)}>
          {Icons.plus} CREAR MINIJUEGO
        </button>
      </div>
    </div>
  );

  // Form to create/edit a minigame
  const renderMgForm = () => {
    const isEditing = mgEditId !== null;
    const editingMg = isEditing ? minigames.find(m => m.id === mgEditId) : null;
    const isBuiltin = editingMg && editingMg.type && editingMg.type.startsWith("builtin_");
    const showActions = mgChance === "bottle" || (editingMg && editingMg.type === "builtin_botella");
    const showCoinProb = mgChance === "coin" || (editingMg && editingMg.type === "builtin_moneda");

    return (
      <div style={S.app}>
        <div style={S.hdr}>
          <button style={S.bk} onClick={() => setScreen("mgEdit")}>{Icons.back}</button>
          <span style={{ fontWeight: 800, fontSize: 17, color: t.accent }}>{isEditing ? "Editar minijuego" : "Crear minijuego"}</span>
          <div style={{ width: 40 }} />
        </div>
        <div style={S.sec}>
          <div style={S.card}>
            <div style={S.lab}>Nombre</div>
            <input style={{ ...S.inp, marginBottom: 14 }} placeholder="Nombre del minijuego" value={mgName} onChange={e => setMgName(e.target.value)} />

            <div style={S.lab}>Descripción</div>
            <textarea style={{ ...S.inp, minHeight: 80, resize: "vertical", marginBottom: 14 }} placeholder="Descripción / reglas..." value={mgDesc} onChange={e => setMgDesc(e.target.value)} />

            <div style={{ marginBottom: 14 }}>
              <div style={S.lab}>¿Tiene jugador asignado?</div>
              <div style={{ display: "flex", gap: 8 }}>
                <button style={S.chip(mgHasP)} onClick={() => setMgHasP(true)}>Sí</button>
                <button style={S.chip(!mgHasP)} onClick={() => setMgHasP(false)}>No</button>
              </div>
            </div>

            <div style={{ marginBottom: 14 }}>
              <div style={S.lab}>Elemento de azar</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button style={S.chip(mgChance === null)} onClick={() => setMgChance(null)}>Ninguno</button>
                <button style={S.chip(mgChance === "coin")} onClick={() => setMgChance("coin")}>Moneda</button>
                <button style={S.chip(mgChance === "bottle")} onClick={() => setMgChance("bottle")}>Botella</button>
                <button style={S.chip(mgChance === "dice")} onClick={() => setMgChance("dice")}>Dado</button>
              </div>
              {isBuiltin && <p style={{ fontSize: 11, color: t.textMuted, marginTop: 6 }}>Es un minijuego predefinido. Cambiar el tipo de azar puede afectar su funcionamiento.</p>}
            </div>

            {showCoinProb && (
              <div style={{ marginBottom: 14 }}>
                <div style={S.lab}>Probabilidad de Cara</div>
                <p style={{ fontSize: 12, color: t.textMuted, marginBottom: 12 }}>Ajusta cuánto sale cada cara. ¡Sé travieso! 😈</p>
                <div style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  marginBottom: 10,
                }}>
                  <div style={{
                    padding: "6px 14px",
                    borderRadius: 12,
                    background: "linear-gradient(135deg,#FFD700,#FFC300)",
                    color: "#1a1a2e",
                    fontSize: 13,
                    fontWeight: 900,
                    minWidth: 70,
                    textAlign: "center",
                  }}>CARA {mgCaraProb}%</div>
                  <div style={{
                    padding: "6px 14px",
                    borderRadius: 12,
                    background: "linear-gradient(135deg,#6B1FE8,#4A0FA0)",
                    color: "#FFD700",
                    fontSize: 13,
                    fontWeight: 900,
                    minWidth: 70,
                    textAlign: "center",
                  }}>CRUZ {100 - mgCaraProb}%</div>
                </div>
                <input
                  type="range"
                  min="0"
                  max="100"
                  step="5"
                  value={mgCaraProb}
                  onChange={e => setMgCaraProb(parseInt(e.target.value, 10))}
                  style={{
                    width: "100%",
                    height: 8,
                    accentColor: t.accent,
                    cursor: "pointer",
                  }}
                />
                <div style={{ display: "flex", gap: 6, marginTop: 12, flexWrap: "wrap" }}>
                  {[0, 25, 50, 75, 100].map(p => (
                    <button
                      key={p}
                      style={{ ...S.chip(mgCaraProb === p), fontSize: 12, padding: "6px 12px" }}
                      onClick={() => setMgCaraProb(p)}
                    >
                      {p}%
                    </button>
                  ))}
                </div>
              </div>
            )}

            {showActions && (
              <div style={{ marginBottom: 14 }}>
                <div style={S.lab}>Acciones (si la botella apunta a alguien)</div>
                <p style={{ fontSize: 12, color: t.textMuted, marginBottom: 10 }}>Cuando la botella apunte a un jugador, se elegirá una de estas acciones al azar.</p>
                <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                  <input
                    style={{ ...S.inp, flex: 1 }}
                    placeholder="Ej: darle un beso"
                    value={mgNewAction}
                    onChange={e => setMgNewAction(e.target.value)}
                    onKeyDown={e => {
                      if (e.key === "Enter" && mgNewAction.trim()) {
                        setMgActions([...mgActions, mgNewAction.trim()]);
                        setMgNewAction("");
                      }
                    }}
                  />
                  <button style={{ ...S.btn, ...S.bP, padding: "12px 16px" }} onClick={() => {
                    if (mgNewAction.trim()) { setMgActions([...mgActions, mgNewAction.trim()]); setMgNewAction(""); }
                  }}>{Icons.plus}</button>
                </div>
                <div>
                  {mgActions.map((a, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 14px", borderRadius: 10, background: t.cardBg, marginBottom: 6, border: `1px solid ${t.cardBorder}` }}>
                      <span style={{ flex: 1, fontSize: 13, color: t.text }}>{a}</span>
                      <button style={{ ...S.ib, color: "#f44336" }} onClick={() => setMgActions(mgActions.filter((_,j)=>j!==i))}>{Icons.trash}</button>
                    </div>
                  ))}
                  {mgActions.length === 0 && <p style={{ fontSize: 12, color: t.textMuted, textAlign: "center", padding: 10 }}>Añade al menos una acción</p>}
                </div>
              </div>
            )}

            <button style={{ ...S.btn, ...S.bP, width: "100%", opacity: mgName.trim() ? 1 : .4 }} onClick={saveMinigame} disabled={!mgName.trim()}>
              {isEditing ? "GUARDAR CAMBIOS" : "CREAR MINIJUEGO"}
            </button>
          </div>
        </div>
      </div>
    );
  };

  return (
    <>
      {screen === "home" && renderHome()}
      {screen === "setup" && renderSetup()}
      {screen === "game" && renderGame()}
      {screen === "editor" && renderEditor()}
      {screen === "editC" && renderEditContent()}
      {screen === "mgEdit" && renderMgList()}
      {screen === "mgEditForm" && renderMgForm()}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Pikiupi />);
</script>
</body>
</html>
